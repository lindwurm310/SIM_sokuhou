name: Post new articles to X and Bluesky

on:
  push:
    branches: [main]
    paths: ["content/*.md"]
  workflow_dispatch:
    inputs:
      files:
        description: "投稿する記事（例：content/2026-10-23-xxx.md、複数はスペース区切り）"
        required: true

permissions:
  contents: write  # カード画像（static/ogp/*.png）とアイキャッチ画像（static/thumb/*.webp）をコミットするため
  issues: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  # 記事のカード画像（SNSで共有したときに大きく出る画像）がまだなければ作ってコミットする
  ogp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make card images
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="$INPUT_FILES"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=""
          else
            changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'content/*.md')
            images=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'static/ogp/*.png')
          fi
          # 追加・書き直しされた記事のうち、同じ push で画像を入れていないものだけ作り直す
          targets=""
          for f in $changed; do
            [ -f "$f" ] || continue
            png="static/ogp/$(basename "$f" .md).png"
            if [ ! -f "$png" ] || { [ "${{ github.event_name }}" != "workflow_dispatch" ] && ! echo "$images" | grep -qx "$png"; }; then
              targets="$targets $f"
            fi
          done
          echo "対象: ${targets:-なし}"
          # サムネイル用のアイキャッチ画像（static/thumb/*.webp）がまだない記事も対象にする
          missing=""
          for f in content/*.md; do
            [ -f "static/thumb/$(basename "$f" .md).webp" ] || missing="$missing $f"
          done
          [ -n "$targets$missing" ] || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q pillow
          [ -z "$targets" ] || python3 scripts/make_ogp.py $targets
          # 画像がまだない記事のぶんだけ作る（作り直しはしない）
          python3 scripts/make_ogp.py
          git add static/ogp static/thumb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "記事のカード画像を追加"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  post:
    needs: ogp
    # 画像づくりに失敗しても投稿の準備は続ける（共通のサイト画像になる）
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 直前のジョブがコミットしたカード画像も含めて取り出す
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Find new articles
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="$INPUT_FILES"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=""
          else
            # 今回の push で新しく追加された記事だけ（書き直しは投稿しない）
            files=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'content/*.md' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "対象: ${files:-なし}"

      - name: Post to X / Bluesky
        if: steps.find.outputs.files != ''
        env:
          # 「Xで投稿する」リンク入りの Issue を作ってスマホに通知する（無料）
          X_INTENT_OUT: ${{ runner.temp }}/x-intent.md
          # X API で自動投稿（有料）。変数 X_POST_ENABLED を true にしたときだけ
          X_POST_ENABLED: ${{ vars.X_POST_ENABLED }}
          X_INCLUDE_URL: ${{ vars.X_INCLUDE_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Bluesky に自動投稿（無料）。変数 BLUESKY_POST_ENABLED を true にしたときだけ
          BLUESKY_POST_ENABLED: ${{ vars.BLUESKY_POST_ENABLED }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 scripts/post_to_x.py ${{ steps.find.outputs.files }}

      - name: Open an issue with "post to X" links
        if: steps.find.outputs.files != '' && vars.X_POST_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/x-intent.md"
          [ -s "$body" ] || exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Xに投稿：新着記事 $(TZ=Asia/Tokyo date +%m/%d)" --body-file "$body"
